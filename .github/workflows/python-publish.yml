name: Upload Python Package

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheel on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: ilammy/msvc-dev-cmd@v1  # Ensure compiler and linker are on PATH (needed for building wheels on windows)

      - uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: cp39-*
          CIBW_SKIP: "*musllinux*"  # umodl/khiops source code does not support musllinux builds
          CIBW_ARCHS: auto64
          CIBW_BEFORE_ALL_LINUX: dnf -y install ninja-build  # GNU/Linux builds are performed in AlmaLinux containers

      - name: Tag built wheel for ABI3 compatibility
        run: pipx run wheel tags --remove --abi-tag=abi3 $(ls wheelhouse/*.whl)
      
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: wheelhouse/*.whl

  pypi-publish:
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/umodl-wrapper
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
